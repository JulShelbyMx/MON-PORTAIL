<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Choice</title>
    <link rel="shortcut icon" href="images/logopage.png" />
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
        }

        .button-container {
            display: flex;
            gap: 30px;
        }

        .stream-button {
            background-color: #ffb300;
            color: #000;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .stream-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 179, 0, 0.7);
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #ffb300;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .back-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 179, 0, 0.7);
        }

        /* Tablet (max-width: 1024px) */
        @media screen and (max-width: 1024px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }

            .stream-button {
                font-size: 1.5rem;
                padding: 15px 30px;
            }

            .button-container {
                gap: 20px;
            }

            .back-button {
                font-size: 0.9rem;
                padding: 8px 15px;
            }
        }

        /* Medium mobile (max-width: 768px) */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 25px;
            }

            .button-container {
                flex-direction: column;
                gap: 15px;
            }

            .stream-button {
                font-size: 1.3rem;
                padding: 12px 25px;
                width: 80%;
                max-width: 300px;
            }

            .back-button {
                font-size: 0.8rem;
                padding: 6px 12px;
                top: 15px;
                left: 15px;
            }
        }

        /* Small mobile (max-width: 480px) */
        @media screen and (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .stream-button {
                font-size: 1.1rem;
                padding: 10px 20px;
                width: 90%;
            }

            .button-container {
                gap: 10px;
            }

            .back-button {
                font-size: 0.7rem;
                padding: 5px 10px;
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">BACK</a>
    <h1>On which streaming page do you want to go?</h1>
    <div class="button-container">
        <a href="Streaming_onepiece/streaming.html" class="stream-button">One Piece</a>
        <a href="Streaming_PeakyBlinders/streaming.html" class="stream-button">Peaky Blinders</a>
    </div>
</body>
</html>
