<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Choice</title>
    <link rel="shortcut icon" href="images/logopage.png" />
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            width: 100%;
            position: relative;
        }

        .split {
            flex: 1;
            height: 100vh;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: filter 0.3s;
        }

        .split:hover {
            filter: brightness(1.2);
        }

        .split.one-piece {
            background: url('images/one_piece_poster.webp') center/cover no-repeat;
        }

        .split.peaky-blinders {
            background: url('images/peaky_blinders_poster.webp') center/cover no-repeat;
        }

        .split.kny {
            background: url('Streaming_kny/choice.jpg') center/cover no-repeat;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .split:hover .overlay {
            opacity: 1;
        }

        .overlay h2 {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffb300;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #ffb300;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }

        .back-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 179, 0, 0.7);
        }

        .temporary-link {
            background: yellow;
            color: #000;
            padding: 15px;
            margin: 10px;
            border: 2px solid red;
            text-align: center;
        }

        .temporary-link p {
            margin: 5px 0;
            font-weight: bold;
        }

        .temporary-link a {
            color: #000;
            text-decoration: underline;
            font-size: 1.1rem;
        }

        /* Tablet (max-width: 1024px) */
        @media screen and (max-width: 1024px) {
            .overlay h2 {
                font-size: 2.5rem;
            }

            .back-button {
                font-size: 0.9rem;
                padding: 8px 15px;
            }
        }

        /* Mobile (max-width: 768px) */
        @media screen and (max-width: 768px) {
            body {
                overflow-y: auto;
            }

            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .split {
                flex: none;
                height: 50vh;
                width: 100%;
            }

            .overlay h2 {
                font-size: 2rem;
            }

            .back-button {
                font-size: 0.8rem;
                padding: 6px 12px;
                top: 15px;
                left: 15px;
            }

            .temporary-link {
                margin: 10px;
                padding: 10px;
            }
        }

        /* Small mobile (max-width: 480px) */
        @media screen and (max-width: 480px) {
            .overlay h2 {
                font-size: 1.5rem;
            }

            .back-button {
                font-size: 0.7rem;
                padding: 5px 10px;
                top: 10px;
                left: 10px;
            }

            .temporary-link a {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">BACK</a>
    <div class="container">
        <a href="Streaming_onepiece/streaming.html" class="split one-piece">
            <div class="overlay">
                <h2>One Piece</h2>
            </div>
        </a>
        <a href="Streaming_PeakyBlinders/streaming.html" class="split peaky-blinders">
            <div class="overlay">
                <h2>Peaky Blinders</h2>
            </div>
        </a>
        <a href="Streaming_kny/kny.html" class="split kny">
            <div class="overlay">
                <h2>Demon Slayer</h2>
            </div>
        </a>
    </div>
    <div class="temporary-link">
        <p><strong>TEMPORARY LINK - REMOVE AFTER WATCHING</strong></p>
        <a href="Streaming_kny/kny.html">Demon Slayer: Infinity Castle (Film)</a>
        <p>This is a temporary addition for the film. Delete this div and the kny.html file once done.</p>
    </div>
</body>
</html>
