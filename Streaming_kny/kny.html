<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Slayer: Infinity Castle</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="shortcut icon" href="../images/logopage.png" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin: 20px 0;
            color: #ffb300;
        }
        a.back-link {
            display: inline-block;
            color: #ffb300;
            text-decoration: none;
            font-size: 1.2em;
            margin: 10px 0;
            padding: 10px 20px;
            border: 2px solid #ffb300;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        a.back-link:hover {
            background: #ffb300;
            color: #1a1a1a;
        }
        #player {
            margin: 20px auto;
            max-width: 900px;
            background: #000;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        iframe {
            width: 100%;
            height: 506px;
            border: none;
            border-radius: 5px;
        }
        .episode-title {
            font-size: 1.5em;
            margin: 15px 0;
            color: #fff;
        }
        #user-section {
            margin: 20px auto;
            max-width: 900px;
            text-align: left;
        }
        #user-status {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            background: #ffb300;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #cc8c00;
        }
        #history-section {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
        }
        #history-section label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        #stop-time {
            padding: 8px;
            width: 200px;
            font-size: 1em;
            background: #333;
            color: #fff;
            border: 1px solid #ffb300;
            border-radius: 5px;
        }
        #save-time {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <a href="../streaming-choice.html" class="back-link">BACK</a>
    <h1>Demon Slayer: Infinity Castle</h1>
    <div class="episode-title">Film</div>
    <div id="player">
        <iframe src="https://vk.com/video_ext.php?oid=865611804&id=456239019" allowfullscreen></iframe>
    </div>

    <div id="user-section">
        <div id="user-status">Not logged in</div>
        <button id="login-btn">Log In</button>
        <button id="signup-btn">Sign Up</button>
        <button id="logout-btn" style="display: none;">Log Out</button>
        
        <div id="history-section" style="display: none;">
            <label for="stop-time">Insérer à quel moment je me suis arrêté : <input type="text" id="stop-time" placeholder="ex: 10:57"></label>
            <button id="save-time">Sauvegarder</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStatus = document.getElementById('user-status');
            const loginBtn = document.getElementById('login-btn');
            const signupBtn = document.getElementById('signup-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const historySection = document.getElementById('history-section');
            const stopTimeInput = document.getElementById('stop-time');
            const saveTimeBtn = document.getElementById('save-time');

            if (typeof netlifyIdentity === 'undefined') {
                console.error('Netlify Identity not loaded');
                userStatus.textContent = 'Error: Netlify Identity not loaded';
                return;
            }

            function updateUI(user) {
                if (user) {
                    userStatus.textContent = `Logged in: ${user.email}`;
                    loginBtn.style.display = 'none';
                    signupBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                    historySection.style.display = 'block';
                    loadStopTime(user);
                } else {
                    userStatus.textContent = 'Not logged in';
                    loginBtn.style.display = 'inline-block';
                    signupBtn.style.display = 'inline-block';
                    logoutBtn.style.display = 'none';
                    historySection.style.display = 'none';
                    stopTimeInput.value = '';
                }
            }

            function loadStopTime(user) {
                const history = (user.user_metadata && user.user_metadata.history) || {};
                const stopTime = history['Demon Slayer'] || '';
                stopTimeInput.value = stopTime;
            }

            function saveStopTime(user, time) {
                const currentHistory = (user.user_metadata && user.user_metadata.history) || {};
                const updatedHistory = { ...currentHistory, 'Demon Slayer': time };
                user.update({
                    data: {
                        history: updatedHistory
                    }
                }).then(() => {
                    console.log('Stop time saved');
                }).catch(err => {
                    console.error('Error saving stop time:', err);
                });
            }

            loginBtn.addEventListener('click', () => netlifyIdentity.open('login'));
            signupBtn.addEventListener('click', () => netlifyIdentity.open('signup'));
            logoutBtn.addEventListener('click', () => netlifyIdentity.logout());

            saveTimeBtn.addEventListener('click', () => {
                const user = netlifyIdentity.currentUser();
                if (user) {
                    const time = stopTimeInput.value.trim();
                    if (time) {
                        saveStopTime(user, time);
                    }
                }
            });

            netlifyIdentity.on('init', updateUI);
            netlifyIdentity.on('login', updateUI);
            netlifyIdentity.on('logout', updateUI);
            netlifyIdentity.on('signup', updateUI);

            // Initial check
            const initialUser = netlifyIdentity.currentUser();
            updateUI(initialUser);
        });
    </script>
</body>
</html>
