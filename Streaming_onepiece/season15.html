<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season 15 (Manga) - Jul's Streaming</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="shortcut icon" href="../images/logopage.png" />
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }
        .streaming-hero {
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-color: #111;
        }
        .return-button {
            padding: 15px 25px;
            background-color: #ffb300;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-family: 'Pirata One', sans-serif;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
            border: 2px solid #0a0a0a;
        }
        .return-button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
        .streaming-container {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .chapter-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .chapter-selector select {
            padding: 10px;
            font-size: 16px;
            background-color: #222;
            color: white;
            border: 2px solid #ffb300;
            border-radius: 8px;
            font-family: 'Pirata One', sans-serif;
        }
        .manga-viewer {
            text-align: center;
        }
        .manga-viewer img {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .chapter-details {
            background: url('../images/categories-texture-parchemin.avif') no-repeat center center/cover;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #ffb300;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            margin-top: 20px;
        }
        .chapter-details h2 {
            font-family: 'Pirata One', sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
        }
        .navigation-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .navigation-buttons button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #ffb300;
            color: #0a0a0a;
            border: 2px solid #0a0a0a;
            border-radius: 8px;
            font-family: 'Pirata One', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .navigation-buttons button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">One Piece Seasons</div>
    </header>

    <section class="streaming-hero">
        <div class="streaming-hero-content">
            <a href="streaming.html" class="return-button">BACK TO SEASONS</a>
        </div>
    </section>

    <div class="streaming-container">
        <div class="chapter-selector">
            <select id="chapter-select"></select>
        </div>

        <div class="manga-viewer" id="manga-viewer"></div>

        <div class="navigation-buttons">
            <button id="prev">Précédent</button>
            <button id="next">Suivant</button>
        </div>

        <div class="chapter-details" id="chapter-details">
            <h2>Chapter 1 - Season 15 (Manga)</h2>
        </div>
    </div>

    <script src="streaming.js"></script>
    <script>
        // Bloquer les pop-ups
        window.open = function() {
            console.log("Tentative de pop-up bloquée");
            return null;
        };
        window.alert = function() {
            console.log("Alerte bloquée");
            return null;
        };

        document.addEventListener('DOMContentLoaded', () => {
            const seasons = generateStreamingLinks();
            const seasonIndex = 15; // Saison 15 (Manga)
            const season = seasons[seasonIndex] || {};
            const chapterSelect = document.getElementById('chapter-select');
            const mangaViewer = document.getElementById('manga-viewer');
            const chapterDetails = document.getElementById('chapter-details');
            const streamingHero = document.querySelector('.streaming-hero');

            if (!season.name || !season.chapters) {
                console.error('Saison non valide:', season);
                chapterDetails.textContent = 'Erreur : saison non trouvée';
                return;
            }

            streamingHero.style.backgroundImage = `url("${season.thumbnail || '../images/default-season-placeholder.jpg'}")`;

            season.chapters.forEach(chapter => {
                const option = document.createElement('option');
                option.value = chapter.chapter;
                option.textContent = `Chapter ${chapter.chapter}`;
                chapterSelect.appendChild(option);
            });

            let currentChapter = 0;
            let currentPage = 0;
            let pages = [];

            async function loadChapter(chapterNumber) {
                const selectedChapter = season.chapters.find(ch => ch.chapter == chapterNumber);
                if (!selectedChapter) {
                    console.error('Chapitre non trouvé:', chapterNumber);
                    chapterDetails.textContent = 'Erreur : chapitre non trouvé';
                    return;
                }
                chapterSelect.value = selectedChapter.chapter;

                try {
                    // Utiliser un proxy CORS pour contourner les restrictions de Mega
                    const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                    const fetchUrl = proxyUrl + selectedChapter.cbzUrl;
                    console.log('Fetching:', fetchUrl);
                    const response = await fetch(fetchUrl, {
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });
                    console.log('Response:', response);
                    if (!response.ok) throw new Error(`Erreur réseau: ${response.status} ${response.statusText}`);
                    const arrayBuffer = await response.arrayBuffer();
                    console.log('ArrayBuffer size:', arrayBuffer.byteLength);
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    console.log('Zip files:', Object.keys(zip.files));

                    pages = [];
                    for (let file in zip.files) {
                        if (file.match(/\.(jpg|jpeg|png)$/i)) {
                            console.log('Found image:', file);
                            const blob = await zip.file(file).async('blob');
                            pages.push(URL.createObjectURL(blob));
                        }
                    }
                    if (pages.length === 0) {
                        throw new Error('Aucune image trouvée dans le CBZ');
                    }
                    pages.sort();
                    currentPage = 0;
                    mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page">`;
                    chapterDetails.innerHTML = `<h2>Chapter ${selectedChapter.chapter} - ${season.name}</h2>`;

                    // Sauvegarde historique
                    const user = netlifyIdentity.currentUser();
                    if (user) {
                        const ip = await getIP();
                        const timestamp = new Date().toLocaleString('fr-FR', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        console.log('Tentative de sauvegarde historique:', {
                            season: season.name,
                            chapter: selectedChapter.chapter,
                            cbzUrl: selectedChapter.cbzUrl,
                            timestamp,
                            ip
                        });

                        const currentHistory = (user.user_metadata && user.user_metadata.history) || {};
                        const currentHistoryLog = (user.user_metadata && user.user_metadata.history_log) || [];
                        user.update({
                            data: {
                                history: {
                                    ...currentHistory,
                                    [season.name]: {
                                        chapter: selectedChapter.chapter,
                                        cbzUrl: selectedChapter.cbzUrl
                                    }
                                },
                                history_log: [
                                    {
                                        season: season.name,
                                        chapter: selectedChapter.chapter,
                                        timestamp,
                                        ip
                                    },
                                    ...currentHistoryLog.slice(0, 49)
                                ]
                            }
                        }).then(() => {
                            console.log('Historique mis à jour');
                        }).catch(err => {
                            console.error('Erreur mise à jour historique:', err);
                        });
                    }
                } catch (error) {
                    mangaViewer.innerHTML = `<p>Erreur: Impossible de charger le chapitre. Vérifiez le lien Mega. Détails: ${error.message}</p>`;
                    console.error('Erreur complète:', error);
                }
            }

            // Charger depuis l’URL
            const hash = window.location.hash;
            if (hash) {
                const chapterNumber = hash.replace('#chapter', '');
                if (season.chapters.some(ch => ch.chapter == chapterNumber)) {
                    currentChapter = chapterNumber - 1;
                    loadChapter(chapterNumber);
                } else {
                    loadChapter(season.chapters[0].chapter);
                }
            } else {
                loadChapter(season.chapters[0].chapter);
            }

            // Navigation
            document.getElementById('next').onclick = () => {
                if (currentPage < pages.length - 1) {
                    currentPage++;
                    mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page">`;
                } else if (currentChapter < season.chapters.length - 1) {
                    currentChapter++;
                    loadChapter(season.chapters[currentChapter].chapter);
                }
            };
            document.getElementById('prev').onclick = () => {
                if (currentPage > 0) {
                    currentPage--;
                    mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page">`;
                } else if (currentChapter > 0) {
                    currentChapter--;
                    loadChapter(season.chapters[currentChapter].chapter);
                }
            };
            chapterSelect.addEventListener('change', (e) => {
                currentChapter = season.chapters.findIndex(ch => ch.chapter == e.target.value);
                loadChapter(e.target.value);
            });

            // Fonction pour obtenir l’IP
            async function getIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    return data.ip || 'Inconnue';
                } catch (err) {
                    console.error('Erreur récupération IP:', err);
                    return 'Inconnue';
                }
            }

            // Protection par mot de passe
            const password = prompt("Entrez le mot de passe :");
            if (password !== "admin") {
                document.body.innerHTML = "<h1>Accès refusé</h1>";
            }
        });
    </script>
</body>
</html>
