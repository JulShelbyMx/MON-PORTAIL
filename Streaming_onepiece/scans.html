<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scans - Jul's Streaming</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="shortcut icon" href="../images/logopage.png" />
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }
        .streaming-hero {
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-color: #111;
        }
        .return-button {
            padding: 15px 25px;
            background-color: #ffb300;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-family: 'Pirata One', sans-serif;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
            border: 2px solid #0a0a0a;
        }
        .return-button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
        .streaming-container {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .chapter-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .chapter-selector select {
            padding: 10px;
            font-size: 16px;
            background-color: #222;
            color: white;
            border: 2px solid #ffb300;
            border-radius: 8px;
            font-family: 'Pirata One', sans-serif;
        }
        .chapter-navigation-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .chapter-navigation-buttons button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #ffb300;
            color: #0a0a0a;
            border: 2px solid #0a0a0a;
            border-radius: 8px;
            font-family: 'Pirata One', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .chapter-navigation-buttons button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
        .manga-viewer {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .manga-viewer img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .manga-viewer .left-half {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M22 6 L10 16 L22 26 L18 16 Z" fill="black" stroke="black" stroke-width="2"/></svg>'), auto;
        }
        .manga-viewer .right-half {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M10 6 L22 16 L10 26 L14 16 Z" fill="black" stroke="black" stroke-width="2"/></svg>'), auto;
        }
        .page-indicator {
            display: block;
            text-align: center;
            padding: 5px 10px;
            font-family: 'Pirata One', sans-serif;
            font-size: 16px;
            color: #ffb300;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffb300;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            margin: 0 auto 10px auto;
            width: fit-content;
        }
        .chapter-details {
            background: url('../images/categories-texture-parchemin.avif') no-repeat center center/cover;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #ffb300;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            margin-top: 20px;
        }
        .chapter-details h2 {
            font-family: 'Pirata One', sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
        }
        .navigation-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .navigation-buttons button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #ffb300;
            color: #0a0a0a;
            border: 2px solid #0a0a0a;
            border-radius: 8px;
            font-family: 'Pirata One', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .navigation-buttons button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
        .error-message {
            color: #ff4444;
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .loading-spinner.active {
            display: block;
        }
        .loading-spinner::after {
            content: "Loading...";
            font-family: 'Pirata One', sans-serif;
            font-size: 18px;
            color: #ffb300;
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: "Loading..."; }
            40% { content: "Loading...."; }
            60% { content: "Loading....."; }
            80%, 100% { content: "Loading......"; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">One Piece Seasons</div>
    </header>

    <section class="streaming-hero">
        <div class="streaming-hero-content">
            <a href="streaming.html" class="return-button">BACK TO SEASONS</a>
        </div>
    </section>

    <div class="streaming-container">
        <div class="chapter-selector">
            <select id="chapter-select"></select>
        </div>

        <div class="chapter-navigation-buttons">
            <button id="prev-chapter">Previous Chapter</button>
            <button id="next-chapter">Next Chapter</button>
        </div>

        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="page-indicator" id="page-indicator">Page 1/1</div>
        <div class="manga-viewer" id="manga-viewer"></div>

        <div class="navigation-buttons">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
        </div>

        <div class="chapter-details" id="chapter-details">
            <h2>Chapter 1 - Scans</h2>
        </div>
    </div>

    <div id="history-log-sidebar"></div>

    <script src="streaming.js"></script>
   <script>
        window.open = function() {
            console.log("Tentative de pop-up bloquée");
            return null;
        };
        window.alert = function() {
            console.log("Alerte bloquée");
            return null;
        };

        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip || 'Unknown';
            } catch (err) {
                console.error('Erreur récupération IP:', err);
                return 'Unknown';
            }
        }

        function convertGoogleDriveUrl(originalUrl) {
            let fileId;
            const viewMatch = originalUrl.match(/\/file\/d\/([^\/]+)/);
            const downloadMatch = originalUrl.match(/id=([^&]+)/);
            
            if (viewMatch && viewMatch[1]) {
                fileId = viewMatch[1];
            } else if (downloadMatch && downloadMatch[1]) {
                fileId = downloadMatch[1];
            }

            if (fileId) {
                const convertedUrl = `/.netlify/functions/proxy-image?id=${fileId}&t=${Date.now()}`;
                console.log(`Conversion URL: ${originalUrl} -> ${convertedUrl}`);
                return convertedUrl;
            }
            console.warn('URL Google Drive non valide:', originalUrl);
            return originalUrl;
        }

        function preloadImages(pages, currentPage) {
            const nextPage = currentPage + 1;
            if (nextPage < pages.length) {
                setTimeout(() => {
                    const img = new Image();
                    img.src = pages[nextPage];
                    console.log(`Préchargement de la page suivante: ${pages[nextPage]}`);
                }, 1000); // Délai pour éviter concurrence
            }
        }

        function scrollToImage() {
            const pageIndicator = document.getElementById('page-indicator');
            const header = document.querySelector('header');
            const streamingHero = document.querySelector('.streaming-hero');

            if (!pageIndicator || !header || !streamingHero) {
                console.error('Erreur : pageIndicator, header ou streamingHero non trouvé');
                return;
            }

            requestAnimationFrame(() => {
                const headerHeight = header.offsetHeight;
                const heroHeight = streamingHero.offsetHeight;
                const pageIndicatorTop = pageIndicator.getBoundingClientRect().top + window.pageYOffset;

                console.log('Défilement - Hauteur header:', headerHeight, 'Hauteur streaming-hero:', heroHeight, 'Position pageIndicatorTop:', pageIndicatorTop);

                const scrollPosition = pageIndicatorTop - (headerHeight + heroHeight) + 10;
                window.scrollTo({
                    top: scrollPosition,
                    behavior: 'smooth'
                });
                console.log('Défilement effectué à:', scrollPosition);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const seasons = window.generateStreamingLinks();
            const season = seasons.find(s => s.fileName === "scans.html");
            const chapterSelect = document.getElementById('chapter-select');
            const mangaViewer = document.getElementById('manga-viewer');
            const pageIndicator = document.getElementById('page-indicator');
            const chapterDetails = document.getElementById('chapter-details');
            const loadingSpinner = document.getElementById('loading-spinner');
            const streamingHero = document.querySelector('.streaming-hero');
            const historyLogSidebar = document.getElementById('history-log-sidebar');
            const hamburgerMenu = document.createElement('div');
            hamburgerMenu.className = 'hamburger-menu';
            hamburgerMenu.innerHTML = `
                <span></span>
                <span></span>
                <span></span>
            `;
            document.querySelector('.streaming-container').prepend(hamburgerMenu);

            if (!season || !season.name || !season.chapters || season.chapters.length === 0) {
                console.error('Saison non valide:', season);
                mangaViewer.innerHTML = '<p class="error-message">Error: Season not found</p>';
                return;
            }

            streamingHero.style.backgroundImage = `url("${season.thumbnail || '../images/default-season-placeholder.jpg'}")`;

            season.chapters.forEach(chapter => {
                const option = document.createElement('option');
                option.value = chapter.chapter;
                option.textContent = `Chapter ${chapter.chapter}`;
                chapterSelect.appendChild(option);
            });

            let currentChapter = 0;
            let currentPage = 0;
            let pages = [];

            function loadChapter(chapterNumber) {
                const selectedChapter = season.chapters.find(ch => ch.chapter == chapterNumber);
                if (!selectedChapter || !selectedChapter.imageUrls) {
                    console.error('Chapitre non trouvé ou invalide:', chapterNumber);
                    mangaViewer.innerHTML = '<p class="error-message">Error: Chapter not found</p>';
                    loadingSpinner.classList.remove('active');
                    return;
                }
                chapterSelect.value = selectedChapter.chapter;

                pages = selectedChapter.imageUrls.map(url => {
                    const convertedUrl = convertGoogleDriveUrl(url);
                    console.log(`Chapitre ${chapterNumber}, URL originale: ${url}, URL convertie: ${convertedUrl}`);
                    return convertedUrl;
                });
                if (!pages || pages.length === 0) {
                    mangaViewer.innerHTML = '<p class="error-message">Error: No images available for this chapter</p>';
                    console.error('Aucune image pour le chapitre:', chapterNumber);
                    loadingSpinner.classList.remove('active');
                    return;
                }
                currentPage = 0;

                loadingSpinner.classList.add('active');
                pageIndicator.textContent = `Page ${currentPage + 1}/${pages.length}`;
                mangaViewer.innerHTML = '';

                const img = new Image();
                img.src = pages[currentPage];
                console.log(`Affichage du chapitre ${chapterNumber}, page ${currentPage + 1}/${pages.length}: ${pages[currentPage]}`);
                img.onload = async () => {
                    // Vérifier X-File-Id
                    const fileId = pages[currentPage].match(/id=([^&]+)/)?.[1];
                    try {
                        const response = await fetch(pages[currentPage], { method: 'HEAD' });
                        const servedFileId = response.headers.get('X-File-Id');
                        if (servedFileId !== fileId) {
                            console.error(`Image incorrecte! Demandé fileId: ${fileId}, Reçu: ${servedFileId}`);
                            mangaViewer.innerHTML = `<p class="error-message">Erreur: Image incorrecte chargée (fileId ${servedFileId} au lieu de ${fileId})</p>`;
                            loadingSpinner.classList.remove('active');
                            return;
                        }
                    } catch (err) {
                        console.warn('Impossible de vérifier X-File-Id:', err);
                    }

                    mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page ${currentPage + 1}">`;
                    loadingSpinner.classList.remove('active');
                    attachImageClickListener();
                    attachCursorListener();
                    scrollToImage();
                    window.updateHistory(season.name, selectedChapter.chapter, currentPage);
                };
                img.onerror = () => {
                    console.error('Erreur chargement image:', pages[currentPage]);
                    mangaViewer.innerHTML = `<p class="error-message">Erreur lors du chargement de l'image (page ${currentPage + 1}). Veuillez réessayer.</p>`;
                    loadingSpinner.classList.remove('active');
                    scrollToImage();
                };

                chapterDetails.innerHTML = `<h2>Chapter ${selectedChapter.chapter} - ${season.name}</h2>`;
                preloadImages(pages, currentPage);
            }

            function attachImageClickListener() {
                const img = mangaViewer.querySelector('img');
                if (img) {
                    img.addEventListener('click', (e) => {
                        const rect = img.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const width = rect.width;
                        const halfWidth = width / 2;

                        if (x < halfWidth) {
                            if (currentPage > 0) {
                                currentPage--;
                                loadingSpinner.classList.add('active');
                                pageIndicator.textContent = `Page ${currentPage + 1}/${pages.length}`;
                                mangaViewer.innerHTML = '';

                                const newImg = new Image();
                                newImg.src = pages[currentPage];
                                console.log(`Affichage du chapitre ${season.chapters[currentChapter].chapter}, page ${currentPage + 1}/${pages.length}: ${pages[currentPage]}`);
                                newImg.onload = async () => {
                                    const fileId = pages[currentPage].match(/id=([^&]+)/)?.[1];
                                    try {
                                        const response = await fetch(pages[currentPage], { method: 'HEAD' });
                                        const servedFileId = response.headers.get('X-File-Id');
                                        if (servedFileId !== fileId) {
                                            console.error(`Image incorrecte! Demandé fileId: ${fileId}, Reçu: ${servedFileId}`);
                                            mangaViewer.innerHTML = `<p class="error-message">Erreur: Image incorrecte chargée (fileId ${servedFileId} au lieu de ${fileId})</p>`;
                                            loadingSpinner.classList.remove('active');
                                            return;
                                        }
                                    } catch (err) {
                                        console.warn('Impossible de vérifier X-File-Id:', err);
                                    }

                                    mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page ${currentPage + 1}">`;
                                    loadingSpinner.classList.remove('active');
                                    attachImageClickListener();
                                    attachCursorListener();
                                    scrollToImage();
                                    window.updateHistory(season.name, season.chapters[currentChapter].chapter, currentPage);
                                };
                                newImg.onerror = () => {
                                    console.error('Erreur chargement image:', pages[currentPage]);
                                    mangaViewer.innerHTML = `<p class="error-message">Erreur lors du chargement de l'image (page ${currentPage + 1}). Veuillez réessayer.</p>`;
                                    loadingSpinner.classList.remove('active');
                                    scrollToImage();
                                };

                                preloadImages(pages, currentPage);
                            } else if (currentChapter > 0) {
                                currentChapter--;
                                loadChapter(season.chapters[currentChapter].chapter);
                            }
                        } else {
                            if (currentPage < pages.length - 1) {
                                currentPage++;
                                loadingSpinner.classList.add('active');
                                pageIndicator.textContent = `Page ${currentPage + 1}/${pages.length}`;
                                mangaViewer.innerHTML = '';

                                const newImg = new Image();
                                newImg.src = pages[currentPage];
                                console.log(`Affichage du chapitre ${season.chapters[currentChapter].chapter}, page ${currentPage + 1}/${pages.length}: ${pages[currentPage]}`);
                                newImg.onload = async () => {
                                    const fileId = pages[currentPage].match(/id=([^&]+)/)?.[1];
                                    try {
                                        const response = await fetch(pages[currentPage], { method: 'HEAD' });
                                        const servedFileId = response.headers.get('X-File-Id');
                                        if (servedFileId !== fileId) {
                                            console.error(`Image incorrecte! Demandé fileId: ${fileId}, Reçu: ${servedFileId}`);
                                            mangaViewer.innerHTML = `<p class="error-message">Erreur: Image incorrecte chargée (fileId ${servedFileId} au lieu de ${fileId})</p>`;
                                            loadingSpinner.classList.remove('active');
                                            return;
                                        }
                                    } catch (err) {
                                        console.warn('Impossible de vérifier X-File-Id:', err);
                                    }

                                    mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page ${currentPage + 1}">`;
                                    loadingSpinner.classList.remove('active');
                                    attachImageClickListener();
                                    attachCursorListener();
                                    scrollToImage();
                                    window.updateHistory(season.name, season.chapters[currentChapter].chapter, currentPage);
                                };
                                newImg.onerror = () => {
                                    console.error('Erreur chargement image:', pages[currentPage]);
                                    mangaViewer.innerHTML = `<p class="error-message">Erreur lors du chargement de l'image (page ${currentPage + 1}). Veuillez réessayer.</p>`;
                                    loadingSpinner.classList.remove('active');
                                    scrollToImage();
                                };

                                preloadImages(pages, currentPage);
                            } else if (currentChapter < season.chapters.length - 1) {
                                currentChapter++;
                                loadChapter(season.chapters[currentChapter].chapter);
                            }
                        }
                    });
                }
            }

            function attachCursorListener() {
                const img = mangaViewer.querySelector('img');
                if (img) {
                    img.addEventListener('mousemove', (e) => {
                        const rect = img.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const width = rect.width;
                        const halfWidth = width / 2;

                        if (x < halfWidth) {
                            img.classList.remove('right-half');
                            img.classList.add('left-half');
                        } else {
                            img.classList.remove('left-half');
                            img.classList.add('right-half');
                        }
                    });

                    img.addEventListener('mouseleave', () => {
                        img.classList.remove('left-half', 'right-half');
                    });
                }
            }

            function initializeSidebar() {
                hamburgerMenu.addEventListener('click', () => {
                    hamburgerMenu.classList.toggle('active');
                    historyLogSidebar.classList.toggle('open');
                });

                historyLogSidebar.addEventListener('click', (e) => {
                    if (e.target.classList.contains('close-sidebar-btn')) {
                        hamburgerMenu.classList.remove('active');
                        historyLogSidebar.classList.remove('open');
                    }
                });
            }

            const hash = window.location.hash;
            if (hash) {
                const chapterNumber = hash.replace('#chapter', '');
                if (season.chapters.some(ch => ch.chapter == chapterNumber)) {
                    currentChapter = season.chapters.findIndex(ch => ch.chapter == chapterNumber);
                    loadChapter(chapterNumber);
                } else {
                    loadChapter(season.chapters[0].chapter);
                }
            } else {
                loadChapter(season.chapters[0].chapter);
            }

            document.getElementById('next-chapter').onclick = () => {
                if (currentChapter < season.chapters.length - 1) {
                    currentChapter++;
                    loadChapter(season.chapters[currentChapter].chapter);
                }
            };

            document.getElementById('prev-chapter').onclick = () => {
                if (currentChapter > 0) {
                    currentChapter--;
                    loadChapter(season.chapters[currentChapter].chapter);
                }
            };

            document.getElementById('next').onclick = () => {
                if (currentPage < pages.length - 1) {
                    currentPage++;
                    loadingSpinner.classList.add('active');
                    pageIndicator.textContent = `Page ${currentPage + 1}/${pages.length}`;
                    mangaViewer.innerHTML = '';

                    const img = new Image();
                    img.src = pages[currentPage];
                    console.log(`Affichage du chapitre ${season.chapters[currentChapter].chapter}, page ${currentPage + 1}/${pages.length}: ${pages[currentPage]}`);
                    img.onload = async () => {
                        const fileId = pages[currentPage].match(/id=([^&]+)/)?.[1];
                        try {
                            const response = await fetch(pages[currentPage], { method: 'HEAD' });
                            const servedFileId = response.headers.get('X-File-Id');
                            if (servedFileId !== fileId) {
                                console.error(`Image incorrecte! Demandé fileId: ${fileId}, Reçu: ${servedFileId}`);
                                mangaViewer.innerHTML = `<p class="error-message">Erreur: Image incorrecte chargée (fileId ${servedFileId} au lieu de ${fileId})</p>`;
                                loadingSpinner.classList.remove('active');
                                return;
                            }
                        } catch (err) {
                            console.warn('Impossible de vérifier X-File-Id:', err);
                        }

                        mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page ${currentPage + 1}">`;
                        loadingSpinner.classList.remove('active');
                        attachImageClickListener();
                        attachCursorListener();
                        scrollToImage();
                        window.updateHistory(season.name, season.chapters[currentChapter].chapter, currentPage);
                    };
                    img.onerror = () => {
                        console.error('Erreur chargement image:', pages[currentPage]);
                        mangaViewer.innerHTML = `<p class="error-message">Erreur lors du chargement de l'image (page ${currentPage + 1}). Veuillez réessayer.</p>`;
                        loadingSpinner.classList.remove('active');
                        scrollToImage();
                    };

                    preloadImages(pages, currentPage);
                } else if (currentChapter < season.chapters.length - 1) {
                    currentChapter++;
                    loadChapter(season.chapters[currentChapter].chapter);
                }
            };

            document.getElementById('prev').onclick = () => {
                if (currentPage > 0) {
                    currentPage--;
                    loadingSpinner.classList.add('active');
                    pageIndicator.textContent = `Page ${currentPage + 1}/${pages.length}`;
                    mangaViewer.innerHTML = '';

                    const img = new Image();
                    img.src = pages[currentPage];
                    console.log(`Affichage du chapitre ${season.chapters[currentChapter].chapter}, page ${currentPage + 1}/${pages.length}: ${pages[currentPage]}`);
                    img.onload = async () => {
                        const fileId = pages[currentPage].match(/id=([^&]+)/)?.[1];
                        try {
                            const response = await fetch(pages[currentPage], { method: 'HEAD' });
                            const servedFileId = response.headers.get('X-File-Id');
                            if (servedFileId !== fileId) {
                                console.error(`Image incorrecte! Demandé fileId: ${fileId}, Reçu: ${servedFileId}`);
                                mangaViewer.innerHTML = `<p class="error-message">Erreur: Image incorrecte chargée (fileId ${servedFileId} au lieu de ${fileId})</p>`;
                                loadingSpinner.classList.remove('active');
                                return;
                            }
                        } catch (err) {
                            console.warn('Impossible de vérifier X-File-Id:', err);
                        }

                        mangaViewer.innerHTML = `<img src="${pages[currentPage]}" loading="lazy" alt="Manga Page ${currentPage + 1}">`;
                        loadingSpinner.classList.remove('active');
                        attachImageClickListener();
                        attachCursorListener();
                        scrollToImage();
                        window.updateHistory(season.name, season.chapters[currentChapter].chapter, currentPage);
                    };
                    img.onerror = () => {
                        console.error('Erreur chargement image:', pages[currentPage]);
                        mangaViewer.innerHTML = `<p class="error-message">Erreur lors du chargement de l'image (page ${currentPage + 1}). Veuillez réessayer.</p>`;
                        loadingSpinner.classList.remove('active');
                        scrollToImage();
                    };

                    preloadImages(pages, currentPage);
                } else if (currentChapter > 0) {
                    currentChapter--;
                    loadChapter(season.chapters[currentChapter].chapter);
                }
            };

            chapterSelect.addEventListener('change', (e) => {
                currentChapter = season.chapters.findIndex(ch => ch.chapter == e.target.value);
                loadChapter(e.target.value);
            });

            initializeSidebar();
        });
    </script>
</body>
</html>
