<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        input, button {
            margin: 10px;
            padding: 8px;
            font-size: 16px;
        }
        #error {
            color: red;
        }
        #imageLink {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Accéder à l'image sécurisée</h1>
    <p>Lien par défaut (sans clé) : <a id="defaultLink" href=""></a></p>
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="checkPassword()">Afficher l'image</button>
    <p id="error"></p>
    <p id="instructions" style="display: none;">Cliquez pour voir l'image.</p>
    <a id="imageLink" href="">Voir l'image</a>

    <script>
        // Lien par défaut (sans clé), configuré via Netlify
        const defaultLink = process.env.DEFAULT_LINK || 'https://mega.nz/file/abcdef';
        const timeoutMinutes = 10;

        // Afficher le lien par défaut
        document.getElementById('defaultLink').href = defaultLink;
        document.getElementById('defaultLink').textContent = defaultLink;

        async function checkPassword() {
            const enteredPassword = document.getElementById('password').value;
            const error = document.getElementById('error');
            const imageLink = document.getElementById('imageLink');
            const instructions = document.getElementById('instructions');

            // Vérifier le mot de passe via Netlify Function
            const response = await fetch('/.netlify/functions/check-password', {
                method: 'POST',
                body: JSON.stringify({ password: enteredPassword })
            });
            const result = await response.json();

            if (result.url) {
                imageLink.href = result.url;
                imageLink.textContent = 'Voir l’image sécurisée';
                imageLink.style.display = 'block';
                instructions.style.display = 'block';
                error.textContent = '';
                setTimeout(resetPage, timeoutMinutes * 60 * 1000);
            } else {
                error.textContent = result.error;
                imageLink.style.display = 'none';
                instructions.style.display = 'none';
            }
        }

        function resetPage() {
            document.getElementById('password').value = '';
            document.getElementById('imageLink').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('error').textContent = '';
        }

        window.onload = resetPage;
    </script>
</body>
</html>
