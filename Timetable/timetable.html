<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliya's Timetable - Year 9 [2024-2025]</title>
    <link rel="stylesheet" href="timetable.css">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../images/logopage.png" />
</head>
<body>
    <div class="timetable-hero">
        <a href="../index.html" class="return-button">BACK</a>
        <button class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="close-sidebar" id="close-sidebar">✕</button>
        <div class="sidebar-tabs">
            <button class="tab-button active" data-tab="holidays">Holidays</button>
            <button class="tab-button" data-tab="bank-holidays">Bank Holidays</button>
        </div>
        <div class="sidebar-content">
            <div class="tab-content active" id="holidays">
                <h2>Holidays</h2>
                <table class="holiday-table" id="holidays-table">
                    <thead>
                        <tr>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="tab-content" id="bank-holidays">
                <h2>Bank Holidays</h2>
                <table class="holiday-table" id="bank-holidays-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="timetable-container">
        <div class="holiday-message" id="holiday-message" style="display: none;">
            No classes today
            <div class="holiday-options" id="holiday-options">
                <button class="toggle-button" id="show-return-timetable">Show the timetable for the first week back</button>
                <button class="toggle-button" id="show-week-timetable">Show the timetable for this week</button>
            </div>
        </div>

        <div class="timetable-toggle">
            <button id="toggle-button" class="toggle-button">Switch to Week B</button>
        </div>

        <div id="timetable-week-a"></div>
        <div id="timetable-week-b" style="display: none;"></div>

        <div class="no-class-message" id="no-class-message">NO CLASS RN</div>
    </div>
