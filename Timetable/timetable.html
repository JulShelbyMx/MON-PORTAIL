<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable - Moorside High School</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="timetable.css">
    <link rel="shortcut icon" href="../images/logopage.png" />
</head>
<body>
    <header>
        <div class="logo">Eliya's Timetable - Year 9 [2024-2025]</div>
    </header>

    <section class="timetable-hero">
        <div class="timetable-hero-content">
            <a href="../index.html" class="return-button">BACK</a>
        </div>
    </section>

    <div class="timetable-container">
        <div id="holiday-message" class="holiday-message" style="display: none;"></div>
        <div id="holiday-options" class="holiday-options" style="display: none;">
            <button id="show-return-timetable" class="toggle-button" style="display: none;">Show the timetable for the first week back</button>
            <button id="show-week-timetable" class="toggle-button" style="display: none;">Show the timetable for this week</button>
        </div>

        <div class="timetable-toggle">
            <button id="toggle-button" class="toggle-button">Switch to Week B</button>
        </div>

        <!-- Conteneur où les plannings seront générés dynamiquement -->
        <div id="timetable-week-a"></div>
        <div id="timetable-week-b" style="display: none;"></div>
        <div id="timetable-week-a-mobile"></div>
        <div id="timetable-week-b-mobile" style="display: none;"></div>
        <div id="no-class-message" class="no-class-message" style="display: none;">NO CLASS RN</div>
    </div>

    <script src="timetable.js"></script>
