<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming - One Piece - Jul's Portal</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="shortcut icon" href="../images/logopage.png" />
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }
        .streaming-hero {
            background: url('../images/onepiece-hero-background.jpg') no-repeat center center/cover;
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .return-button {
            padding: 15px 25px;
            background-color: #ffb300;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-family: 'Pirata One', sans-serif;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
            border: 2px solid #0a0a0a;
        }
        .return-button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
        .streaming-container {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .season-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .season-card {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            width: 200px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .season-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        .season-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
        }
        .season-card h3 {
            margin-top: 10px;
            font-size: 16px;
            color: #ffb300;
            font-family: 'Pirata One', sans-serif;
        }
        .season-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .auth-container, #history {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            color: #fff;
            text-align: center;
        }
        button {
            background: #ffb300;
            border: none;
            padding: 8px;
            margin: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #e0a800;
        }
        .history-card {
            display: flex;
            align-items: center;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            margin: 10px 0;
            position: relative;
        }
        .history-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        .history-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 10px;
        }
        .history-card .history-info {
            text-align: left;
        }
        .history-card h3 {
            margin: 0;
            font-size: 14px;
            color: #ffb300;
            font-family: 'Pirata One', sans-serif;
        }
        .history-card p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #fff;
        }
        .history-card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .delete-history {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-history:hover {
            background: #cc0000;
        }
        /* Hamburger menu */
        .hamburger-menu {
            cursor: pointer;
            width: 30px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin: 10px auto;
        }
        .hamburger-menu span {
            display: block;
            width: 100%;
            height: 4px;
            background: #ffb300;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .hamburger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }
        .hamburger-menu.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }
        /* Sidebar */
        .history-log-sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: #1a1a1a;
            padding: 20px;
            transition: left 0.3s ease;
            z-index: 999;
            overflow-y: auto;
        }
        .history-log-sidebar.open {
            left: 0;
        }
        .history-log-sidebar h2 {
            color: #ffb300;
            font-family: 'Pirata One', sans-serif;
            margin-top: 0;
        }
        .history-log-list {
            list-style: none;
            padding: 0;
        }
        .history-log-list li {
            background: #222;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 12px;
        }
        .close-sidebar {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .close-sidebar:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>
    <div class="history-log-sidebar" id="history-log-sidebar">
        <button class="close-sidebar" id="close-sidebar">Close</button>
        <p>No full logs yet.</p>
    </div>
    <header>
        <div class="logo">One Piece Streaming</div>
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search a season..." autocomplete="off">
            <button id="search-button"><img src="../images/search-bar-logo.png" alt="Search Logo"></button>
            <ul id="search-suggestions" class="suggestions-list"></ul>
        </div>
    </header>
    <section class="streaming-hero">
        <div class="streaming-hero-content">
            <a href="../index.html" class="return-button">BACK</a>
        </div>
    </section>
    <div class="auth-container">
        <p id="user-status">Not logged in yet</p>
        <button id="login-btn" onclick="netlifyIdentity.open('login')">Log in</button>
        <button id="signup-btn" onclick="netlifyIdentity.open('signup')">Sign up</button>
        <button id="logout-btn" onclick="netlifyIdentity.logout()" style="display:none;">Log out</button>
    </div>
    <div id="history">
        <h2>Resume</h2>
        <p id="history-content">No logs yet.</p>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <div class="streaming-container">
        <div class="season-list" id="season-list"></div>
    </div>
    <script defer src="streaming.js"></script>
</body>
</html>
