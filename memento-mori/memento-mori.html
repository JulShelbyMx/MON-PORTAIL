<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento Mori - Jul's Portal</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="shortcut icon" href="../images/logopage.png" />
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }
        .memento-hero {
            background: url('../images/memento-mori-background.jpg') no-repeat center center/cover;
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .return-button {
            padding: 15px 25px;
            background-color: #ffb300;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-family: 'Pirata One', sans-serif;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
            border: 2px solid #0a0a0a;
        }
        .return-button:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }
        .memento-container {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
            text-align: center;
        }
        .grid-container {
            display: inline-block;
            position: relative;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(52, 12px);
            grid-gap: 2px;
            background-color: #ffb300;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .grid div {
            width: 12px;
            height: 12px;
            background-color: #ffb300;
            border: 2px solid #0a0a0a;
            cursor: pointer;
            position: relative;
        }
        .grid div.filled {
            background-color: #000;
            border: 2px solid #0a0a0a;
        }
        .grid div.selected {
            border: 2px solid #ff0000;
        }
        .message-box {
            margin: 20px auto;
            padding: 10px;
            background-color: #0a0a0a;
            color: #ffb300;
            border-radius: 8px;
            font-family: 'Pirata One', sans-serif;
            font-size: 16px;
            min-height: 30px;
            display: block;
            width: fit-content;
        }
        .delete-menu {
            margin-top: 20px;
            padding: 15px;
            background-color: #1a1a1a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .delete-menu button {
            background: #ffb300;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Pirata One', sans-serif;
            font-size: 14px;
        }
        .delete-menu button:hover {
            background: #e0a800;
        }
        .selected-cells {
            color: #ffb300;
            margin-bottom: 10px;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
        }
        .years-labels {
            position: absolute;
            left: -40px;
            top: 15px;
            height: calc(100% - 30px);
            display: flex;
            flex-direction: column;
            color: #ffb300;
            font-family: 'Pirata One', sans-serif;
        }
        .years-labels span {
            font-size: 14px;
            height: 12px;
            line-height: 12px;
            margin-bottom: 2px;
        }
        .years-labels span:nth-child(10n) {
            margin-bottom: 12px;
        }
        .grid div:nth-child(520n) {
            margin-bottom: 10px;
        }
        .auth-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            color: #fff;
            text-align: center;
        }
        button {
            background: #ffb300;
            border: none;
            padding: 8px;
            margin: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #e0a800;
        }

        /* Media Queries pour mobile */
        @media (max-width: 768px) {
            .memento-hero {
                height: 20vh;
            }
            .return-button {
                padding: 10px 20px;
                font-size: 16px;
            }
            .memento-container {
                padding: 10px;
                margin: 10px auto;
            }
            .grid {
                grid-template-columns: repeat(52, 8px);
                padding: 10px;
            }
            .grid div {
                width: 8px;
                height: 8px;
                border: 1px solid #0a0a0a;
            }
            .grid div.filled {
                border: 1px solid #0a0a0a;
            }
            .grid div.selected {
                border: 1px solid #ff0000;
            }
            .years-labels {
                left: -30px;
                top: 10px;
            }
            .years-labels span {
                font-size: 12px;
                height: 8px;
                line-height: 8px;
                margin-bottom: 2px;
            }
            .years-labels span:nth-child(10n) {
                margin-bottom: 10px;
            }
            .grid div:nth-child(520n) {
                margin-bottom: 8px;
            }
            .message-box {
                font-size: 14px;
                padding: 8px;
                margin: 10px auto;
            }
            .delete-menu {
                padding: 10px;
            }
            .delete-menu button {
                padding: 6px 12px;
                font-size: 12px;
            }
            .selected-cells {
                font-size: 12px;
            }
            .auth-container {
                max-width: 90%;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .memento-hero {
                height: 15vh;
            }
            .return-button {
                padding: 8px 15px;
                font-size: 14px;
            }
            .grid {
                grid-template-columns: repeat(52, 6px);
                padding: 8px;
            }
            .grid div {
                width: 6px;
                height: 6px;
                border: 1px solid #0a0a0a;
            }
            .grid div.filled {
                border: 1px solid #0a0a0a;
            }
            .grid div.selected {
                border: 1px solid #ff0000;
            }
            .years-labels {
                left: -25px;
                top: 8px;
            }
            .years-labels span {
                font-size: 10px;
                height: 6px;
                line-height: 6px;
                margin-bottom: 2px;
            }
            .years-labels span:nth-child(10n) {
                margin-bottom: 8px;
            }
            .grid div:nth-child(520n) {
                margin-bottom: 6px;
            }
            .message-box {
                font-size: 12px;
                padding: 6px;
                margin: 8px auto;
            }
            .delete-menu {
                padding: 8px;
            }
            .delete-menu button {
                padding: 5px 10px;
                font-size: 10px;
            }
            .selected-cells {
                font-size: 10px;
            }
            .auth-container {
                max-width: 95%;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Memento Mori</div>
    </header>

    <section class="memento-hero">
        <div class="memento-hero-content">
            <a href="../index.html" class="return-button">BACK</a>
        </div>
    </section>

    <div class="auth-container">
        <p id="user-status">Not logged in</p>
        <button id="login-btn" onclick="netlifyIdentity.open('login')">Log In</button>
        <button id="signup-btn" onclick="netlifyIdentity.open('signup')">Sign Up</button>
        <button id="logout-btn" onclick="netlifyIdentity.logout()" style="display:none;">Log Out</button>
    </div>

    <div class="memento-container">
        <div class="grid-container">
            <div class="years-labels" id="years-labels"></div>
            <div class="grid" id="memento-grid"></div>
        </div>
        <div class="message-box" id="message-box">Cliquez sur une case pour voir son état.</div>
        <div class="delete-menu">
            <div class="selected-cells" id="selected-cells">Cases sélectionnées : Aucune</div>
            <button onclick="toggleSelectMode()">Activer/Désactiver mode suppression</button>
            <button onclick="deleteSelectedCells()">Supprimer les cases sélectionnées</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('memento-grid');
            const yearsLabels = document.getElementById('years-labels');
            const messageBox = document.getElementById('message-box');
            const selectedCellsDisplay = document.getElementById('selected-cells');
            const totalYears = 100;
            const weeksPerYear = 52;
            let selectMode = false;
            let selectedCells = [];

            // Générer les étiquettes des années (1 à 100)
            for (let year = 1; year <= totalYears; year++) {
                const label = document.createElement('span');
                label.textContent = year;
                yearsLabels.appendChild(label);
            }

            // Générer la grille (100 ans x 52 semaines)
            for (let year = 0; year < totalYears; year++) {
                for (let week = 0; week < weeksPerYear; week++) {
                    const cell = document.createElement('div');
                    cell.dataset.year = year + 1;
                    cell.dataset.week = week + 1;
                    grid.appendChild(cell);
                }
            }

            // Calculer les dates pour chaque case
            const startDate = new Date('2008-04-20'); // Dimanche 20 avril 2008 (année 1, semaine 1)
            const datesMap = new Map();
            let currentDate = new Date(startDate);
            let yearIndex = 1;
            let weekIndex = 1;

            // Total de 888 semaines jusqu'à année 17, semaine 1 (27 avril 2025)
            while (yearIndex <= totalYears) {
                const key = `${yearIndex}-${weekIndex}`;
                datesMap.set(key, currentDate.toLocaleString('fr-FR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }));
                currentDate.setDate(currentDate.getDate() + 7);
                weekIndex++;
                if (weekIndex > weeksPerYear) {
                    weekIndex = 1;
                    yearIndex++;
                }
            }

            // Charger l'historique des cases remplies
            function loadGrid() {
                const user = netlifyIdentity.currentUser();
                if (!user) return;

                const history = (user.user_metadata && user.user_metadata.memento) || {};
                Object.entries(history).forEach(([key, data]) => {
                    const [year, week] = key.split('-').map(Number);
                    const cell = document.querySelector(`[data-year="${year}"][data-week="${week}"]`);
                    if (cell) {
                        cell.classList.add('filled');
                        cell.dataset.timestamp = data.timestamp;
                    }
                });

                // Pré-remplir toutes les cases jusqu'à la semaine 1 de l'année 17
                yearIndex = 1;
                weekIndex = 1;
                let totalWeeksFilled = 0;
                const weeksUntilYear17Week1 = 888; // 888 semaines jusqu'au 27 avril 2025
                while (totalWeeksFilled < weeksUntilYear17Week1 && yearIndex <= totalYears) {
                    const cell = document.querySelector(`[data-year="${yearIndex}"][data-week="${weekIndex}"]`);
                    if (cell && !cell.classList.contains('filled')) {
                        const key = `${yearIndex}-${weekIndex}`;
                        cell.classList.add('filled');
                        cell.dataset.timestamp = datesMap.get(key);
                    }
                    totalWeeksFilled++;
                    weekIndex++;
                    if (weekIndex > weeksPerYear) {
                        weekIndex = 1;
                        yearIndex++;
                    }
                }
            }

            // Mettre à jour l'historique
            async function updateGrid(year, week, action, timestamp = null) {
                const user = netlifyIdentity.currentUser();
                if (!user) return;

                const ip = await getIP();
                const key = `${year}-${week}`;
                const currentHistory = (user.user_metadata && user.user_metadata.memento) || {};

                if (action === 'fill') {
                    const cellTimestamp = timestamp || currentHistory[key]?.timestamp || datesMap.get(key) || new Date().toLocaleString('fr-FR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    currentHistory[key] = { timestamp: cellTimestamp };
                } else if (action === 'delete') {
                    delete currentHistory[key];
                }

                await user.update({
                    data: { memento: currentHistory }
                });

                const cell = document.querySelector(`[data-year="${year}"][data-week="${week}"]`);
                if (action === 'fill') {
                    cell.classList.add('filled');
                    cell.dataset.timestamp = currentHistory[key].timestamp;
                    messageBox.textContent = `Case remplie le : ${cell.dataset.timestamp}`;
                } else if (action === 'delete') {
                    cell.classList.remove('filled');
                    cell.classList.remove('selected');
                    cell.dataset.timestamp = '';
                    messageBox.textContent = 'Case non remplie';
                    updateSelectedCellsDisplay();
                }
            }

            async function getIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    return data.ip || 'Inconnue';
                } catch (err) {
                    console.error('Erreur récupération IP:', err);
                    return 'Inconnue';
                }
            }

            // Activer/désactiver le mode suppression
            window.toggleSelectMode = function () {
                selectMode = !selectMode;
                if (!selectMode) {
                    selectedCells = [];
                    document.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
                    updateSelectedCellsDisplay();
                }
            };

            // Supprimer les cases sélectionnées
            window.deleteSelectedCells = async function () {
                for (const { year, week } of selectedCells) {
                    await updateGrid(year, week, 'delete');
                }
                selectedCells = [];
                document.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
                updateSelectedCellsDisplay();
            };

            // Mettre à jour l'affichage des cases sélectionnées
            function updateSelectedCellsDisplay() {
                if (selectedCells.length === 0) {
                    selectedCellsDisplay.textContent = 'Cases sélectionnées : Aucune';
                } else {
                    const cellsText = selectedCells.map(cell => `Année ${cell.year}, Semaine ${cell.week}`).join('; ');
                    selectedCellsDisplay.textContent = `Cases sélectionnées : ${cellsText}`;
                }
            }

            // Gérer les clics sur les cases
            grid.addEventListener('click', async (e) => {
                const cell = e.target.closest('div');
                if (!cell || !cell.dataset.year) return;

                const year = parseInt(cell.dataset.year);
                const week = parseInt(cell.dataset.week);

                if (selectMode) {
                    const cellKey = `${year}-${week}`;
                    const cellIndex = selectedCells.findIndex(c => c.year === year && c.week === week);
                    if (cellIndex === -1) {
                        selectedCells.push({ year, week });
                        cell.classList.add('selected');
                    } else {
                        selectedCells.splice(cellIndex, 1);
                        cell.classList.remove('selected');
                    }
                    updateSelectedCellsDisplay();
                } else {
                    const isFilled = cell.classList.contains('filled');
                    if (!isFilled) {
                        const key = `${year}-${week}`;
                        const timestamp = datesMap.get(key);
                        await updateGrid(year, week, 'fill', timestamp);
                    } else {
                        messageBox.textContent = `Case remplie le : ${cell.dataset.timestamp}`;
                    }
                }
            });

            // Gestion de l'authentification
            const userStatus = document.getElementById('user-status');
            const loginBtn = document.getElementById('login-btn');
            const signupBtn = document.getElementById('signup-btn');
            const logoutBtn = document.getElementById('logout-btn');

            function updateUI(user) {
                if (user) {
                    userStatus.textContent = `Connecté: ${user.email}`;
                    loginBtn.style.display = 'none';
                    signupBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                    loadGrid();
                } else {
                    userStatus.textContent = 'Non connecté';
                    loginBtn.style.display = 'inline-block';
                    signupBtn.style.display = 'inline-block';
                    logoutBtn.style.display = 'none';
                    grid.querySelectorAll('.filled').forEach(cell => {
                        if (!datesMap.has(`${cell.dataset.year}-${cell.dataset.week}`)) {
                            cell.classList.remove('filled');
                            cell.dataset.timestamp = '';
                        }
                    });
                    messageBox.textContent = 'Cliquez sur une case pour voir son état.';
                }
            }

            netlifyIdentity.on('init', (user) => updateUI(user));
            netlifyIdentity.on('login', (user) => { updateUI(user); netlifyIdentity.close(); });
            netlifyIdentity.on('logout', () => updateUI(null));
            netlifyIdentity.on('signup', (user) => { updateUI(user); netlifyIdentity.close(); });

            const checkUser = () => {
                const user = netlifyIdentity.currentUser();
                updateUI(user);
            };
            checkUser();
            setInterval(checkUser, 5000);
        });
    </script>
</body>
</html>
