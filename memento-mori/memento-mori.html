<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento Mori - Jul's Portal</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="shortcut icon" href="../images/logopage.png" />
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      body {
    background-color: #111;
    color: white;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    }
    .memento-hero {
        background: url('../images/onepiece-hero-background.jpg') no-repeat center center/cover;
        height: 30vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .return-button {
        padding: 15px 25px;
        background-color: #ffb300;
        color: #0a0a0a;
        text-decoration: none;
        border-radius: 10px;
        font-size: 20px;
        font-family: 'Pirata One', sans-serif;
        font-weight: bold;
        transition: background-color 0.3s ease, transform 0.3s ease;
        border: 2px solid #0a0a0a;
    }
    .return-button:hover {
        background-color: #e0a800;
        transform: scale(1.05);
    }
    .memento-container {
        padding: 20px;
        max-width: 1200px;
        margin: 20px auto;
        text-align: center;
    }
    .grid-container {
        display: inline-block;
        position: relative;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(52, 12px);
        grid-gap: 2px;
        background-color: #ffb300;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    .grid div {
        width: 12px;
        height: 12px;
        background-color: #ffb300;
        border: 2px solid #0a0a0a;
        cursor: pointer;
        position: relative;
    }
    .grid div.filled {
        background-color: #000;
        border: 2px solid #0a0a0a;
    }
    .grid div.selected {
        border: 2px solid #ff0000;
    }
    .message-box {
        margin: 20px auto;
        padding: 10px;
        background-color: #0a0a0a;
        color: #ffb300;
        border-radius: 8px;
        font-family: 'Pirata One', sans-serif;
        font-size: 16px;
        min-height: 30px;
        display: block;
        width: fit-content;
    }
    .delete-menu {
        margin-top: 20px;
        padding: 15px;
        background-color: #1a1a1a;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .delete-menu button {
        background: #ffb300;
        border: none;
        padding: 8px 15px;
        margin: 5px;
        cursor: pointer;
        border-radius: 5px;
        font-family: 'Pirata One', sans-serif;
        font-size: 14px;
    }
    .delete-menu button:hover {
        background: #e0a800;
    }
    .selected-cells {
        color: #ffb300;
        margin-bottom: 10px;
        font-family: 'Arial', sans-serif;
        font-size: 14px;
    }
    .years-labels {
        position: absolute;
        right: -40px;
        top: 15px;
        height: calc(100% - 30px);
        display: flex;
        flex-direction: column;
        color: #ffb300;
        font-family: 'Pirata One', sans-serif;
        text-align: right;
    }
    .years-labels span {
        font-size: 14px;
        height: 12px;
        line-height: 12px;
        margin-bottom: 2px;
    }
    .years-labels span:nth-child(10n) {
        margin-bottom: 12px;
    }
    .grid div:nth-child(520n) {
        margin-bottom: 10px;
    }
    .auth-container {
        max-width: 400px;
        margin: 20px auto;
        padding: 20px;
        background: #1a1a1a;
        border-radius: 8px;
        color: #fff;
        text-align: center;
    }
    button {
        background: #ffb300;
        border: none;
        padding: 8px;
        margin: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #e0a800;
    }
    @media (max-width: 768px) {
        .memento-hero {
            height: 20vh;
        }
        .return-button {
            padding: 10px 20px;
            font-size: 16px;
        }
        .memento-container {
            padding: 5px;
            margin: 5px auto;
            max-width: 100%;
        }
        .grid-container {
            display: block;
            width: 100%;
            max-width: 427px; /* Ajuster pour inclure grille + étiquettes */
            margin: 0 auto;
        }
        .grid {
            grid-template-columns: repeat(52, 7px); /* Augmenter la taille des cases */
            grid-gap: 1px;
            padding: 8px;
            width: 407px; /* Largeur corrigée : 52 * 7px + 51 * 1px + 16px + 52 * 1px (bordures) */
            height: 866px; /* Hauteur corrigée : 100 * 7px + 99 * 1px + 16px + 100 * 1px (bordures) */
            box-sizing: content-box;
        }
        .grid div {
            width: 7px;
            height: 7px;
            border: 0.5px solid #0a0a0a;
            box-sizing: border-box;
        }
        .grid div.filled {
            border: 0.5px solid #0a0a0a;
        }
        .grid div.selected {
            border: 1px solid #ff0000;
        }
        .years-labels {
            right: -20px;
            top: 8px;
        }
        .years-labels span {
            font-size: 10px;
            height: 8px; /* Ajuster pour mieux s'aligner */
            line-height: 8px;
            margin-bottom: 0px;
        }
        .years-labels span:nth-child(10n) {
            margin-bottom: 7px;
        }
        .grid div:nth-child(520n) {
            margin-bottom: 7px;
        }
        .message-box {
            font-size: 14px;
            padding: 8px;
            margin: 10px auto;
        }
        .delete-menu {
            padding: 10px;
        }
        .delete-menu button {
            padding: 6px 12px;
            font-size: 12px;
        }
        .selected-cells {
            font-size: 12px;
        }
        .auth-container {
            max-width: 90%;
            padding: 15px;
        }
    }
    @media (max-width: 480px) {
        .memento-hero {
            height: 15vh;
        }
        .return-button {
            padding: 8px 15px;
            font-size: 14px;
        }
        .memento-container {
            padding: 5px;
            margin: 5px auto;
            max-width: 100%;
        }
        .grid-container {
            display: block;
            width: 100%;
            max-width: 400px; /* Ajuster pour inclure grille + étiquettes */
            margin: 0 auto;
        }
        .grid {
            grid-template-columns: repeat(52, 7px);
            grid-gap: 0.5px;
            padding: 8px;
            width: 400px; /* Largeur corrigée : 52 * 7px + 51 * 0.5px + 16px + 52 * 1px (bordures) */
            height: 815.5px; /* Hauteur corrigée : 100 * 7px + 99 * 0.5px + 16px + 100 * 1px (bordures) */
            box-sizing: content-box;
        }
        .grid div {
            width: 7px;
            height: 7px;
            border: 0.5px solid #0a0a0a;
            box-sizing: border-box;
        }
        .grid div.filled {
            border: 0.5px solid #0a0a0a;
        }
        .grid div.selected {
            border: 1px solid #ff0000;
        }
        .years-labels {
            right: -15px;
            top: 8px;
        }
        .years-labels span {
            font-size: 8px;
            height: 7.5px; /* Ajuster pour mieux s'aligner */
            line-height: 7.5px;
            margin-bottom: 0px;
        }
        .years-labels span:nth-child(10n) {
            margin-bottom: 7px;
        }
        .grid div:nth-child(520n) {
            margin-bottom: 7px;
        }
        .message-box {
            font-size: 12px;
            padding: 6px;
            margin: 8px auto;
        }
        .delete-menu {
            padding: 8px;
        }
        .delete-menu button {
            padding: 5px 10px;
            font-size: 10px;
        }
        .selected-cells {
            font-size: 10px;
        }
        .auth-container {
            max-width: 95%;
            padding: 10px;
        }
    }
    </style>
</head>
<body>
    <header>
        <div class="logo">Memento Mori</div>
    </header>

    <section class="memento-hero">
        <div class="memento-hero-content">
            <a href="../index.html" class="return-button">BACK</a>
        </div>
    </section>

    <div class="auth-container">
        <p id="user-status">Not logged in</p>
        <button id="login-btn" onclick="netlifyIdentity.open('login')">Log In</button>
        <button id="signup-btn" onclick="netlifyIdentity.open('signup')">Sign Up</button>
        <button id="logout-btn" onclick="netlifyIdentity.logout()" style="display:none;">Log Out</button>
    </div>

    <div class="memento-container">
        <div class="grid-container">
            <div class="years-labels" id="years-labels"></div>
            <div class="grid" id="memento-grid"></div>
        </div>
        <div class="message-box" id="message-box">Cliquez sur une case pour voir son état.</div>
        <div class="delete-menu">
            <div class="selected-cells" id="selected-cells">Cases sélectionnées : Aucune</div>
            <button onclick="toggleSelectMode()">Activer/Désactiver mode suppression</button>
            <button onclick="deleteSelectedCells()">Supprimer les cases sélectionnées</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('memento-grid');
            const yearsLabels = document.getElementById('years-labels');
            const messageBox = document.getElementById('message-box');
            const selectedCellsDisplay = document.getElementById('selected-cells');
            const totalYears = 100;
            const weeksPerYear = 52;
            let selectMode = false;
            let selectedCells = [];

            // Générer les étiquettes des années (1 à 100)
            for (let year = 1; year <= totalYears; year++) {
                const label = document.createElement('span');
                label.textContent = year;
                yearsLabels.appendChild(label);
            }

            // Générer la grille (100 ans x 52 semaines)
            for (let year = 0; year < totalYears; year++) {
                for (let week = 0; week < weeksPerYear; week++) {
                    const cell = document.createElement('div');
                    cell.dataset.year = year + 1; // Lignes étiquetées 1 à 100
                    cell.dataset.week = week + 1;
                    grid.appendChild(cell);
                }
            }

            // Définir les dates uniquement pour 18-2 et les nouvelles cases
            const datesMap = new Map();
            datesMap.set('18-2', '27/04/2025, 17:30'); // Date fixée pour 18-2 avec heure à 17h30

            // Charger l'historique des cases remplies
            function loadGrid() {
                const user = netlifyIdentity.currentUser();
                if (!user) {
                    console.log('Utilisateur non connecté, grille non remplie');
                    return;
                }

                const history = (user.user_metadata && user.user_metadata.memento) || {};

                // Étape 1 : Charger toutes les cases remplies depuis l'historique
                Object.entries(history).forEach(([key, data]) => {
                    const [year, week] = key.split('-').map(Number);
                    const cell = document.querySelector(`[data-year="${year}"][data-week="${week}"]`);
                    if (cell) {
                        cell.classList.add('filled');
                        cell.dataset.timestamp = data.timestamp || '';
                        console.log(`Chargement case ${key} depuis l'historique: ${cell.dataset.timestamp || 'Aucune date'}`);
                    }
                });

                // Étape 2 : Pré-remplir jusqu'à la semaine 2 de l'année 18 (27 avril 2025) si pas déjà dans l'historique
                let yearIndex = 1;
                let weekIndex = 1;
                const totalWeeksToFill = 886;
                let weeksFilled = 0;

                while (weeksFilled < totalWeeksToFill && yearIndex <= totalYears) {
                    const key = `${yearIndex}-${weekIndex}`;
                    const cell = document.querySelector(`[data-year="${yearIndex}"][data-week="${weekIndex}"]`);
                    if (cell && !cell.classList.contains('filled')) { // Remplir uniquement si pas déjà dans l'historique
                        cell.classList.add('filled');
                        // Ajouter un timestamp uniquement pour 18-2
                        if (key === '18-2') {
                            cell.dataset.timestamp = datesMap.get(key);
                        } else {
                            cell.dataset.timestamp = ''; // Pas de date pour les autres cases
                        }
                        console.log(`Remplissage initial case ${key}: ${cell.dataset.timestamp || 'Aucune date'}`);
                    }
                    weeksFilled++;
                    weekIndex++;
                    if (weekIndex > weeksPerYear) {
                        weekIndex = 1;
                        yearIndex++;
                    }
                }

                // Étape 3 : Ne plus déremplir les cases après 18-2, car elles peuvent être remplies manuellement
                // Les cases remplies manuellement sont déjà chargées depuis l'historique au début de la fonction
            }

            // Mettre à jour l'historique
            async function updateGrid(year, week, action, timestamp = null) {
                const user = netlifyIdentity.currentUser();
                if (!user) {
                    console.log('Utilisateur non connecté, impossible de mettre à jour la grille');
                    messageBox.textContent = 'Veuillez vous connecter pour modifier la grille.';
                    return;
                }

                const key = `${year}-${week}`;
                let currentHistory = (user.user_metadata && user.user_metadata.memento) || {};

                if (action === 'fill') {
                    const cellTimestamp = timestamp || new Date().toLocaleString('fr-FR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    currentHistory[key] = { timestamp: cellTimestamp };
                    console.log(`Ajout de la case ${key} avec timestamp: ${cellTimestamp}`);
                } else if (action === 'delete') {
                    delete currentHistory[key];
                    console.log(`Suppression de la case ${key}`);
                }

                try {
                    await user.update({
                        data: { memento: currentHistory }
                    });
                    console.log(`Mise à jour réussie pour ${action} de la case ${key}`);
                } catch (error) {
                    console.error(`Erreur lors de la mise à jour de la grille pour ${action}:`, error);
                    messageBox.textContent = `Erreur lors de la ${action === 'fill' ? 'mise à jour' : 'suppression'}.`;
                    return;
                }

                const cell = document.querySelector(`[data-year="${year}"][data-week="${week}"]`);
                if (action === 'fill') {
                    cell.classList.add('filled');
                    cell.dataset.timestamp = currentHistory[key].timestamp;
                    messageBox.textContent = `Case remplie le : ${cell.dataset.timestamp}`;
                } else if (action === 'delete') {
                    cell.classList.remove('filled');
                    cell.classList.remove('selected');
                    cell.dataset.timestamp = '';
                    messageBox.textContent = 'Case supprimée';
                    updateSelectedCellsDisplay();
                }
            }

            async function getIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    return data.ip || 'Inconnue';
                } catch (err) {
                    console.error('Erreur récupération IP:', err);
                    return 'Inconnue';
                }
            }

            // Activer/désactiver le mode suppression
            window.toggleSelectMode = function () {
                selectMode = !selectMode;
                if (!selectMode) {
                    selectedCells = [];
                    document.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
                    updateSelectedCellsDisplay();
                    messageBox.textContent = 'Mode suppression désactivé';
                } else {
                    messageBox.textContent = 'Mode suppression activé';
                }
            };

            // Supprimer les cases sélectionnées
            window.deleteSelectedCells = async function () {
                if (selectedCells.length === 0) {
                    messageBox.textContent = 'Aucune case sélectionnée à supprimer';
                    return;
                }

                for (const { year, week } of selectedCells) {
                    await updateGrid(year, week, 'delete');
                }
                selectedCells = [];
                document.querySelectorAll('.selected').forEach(cell => cell.classList.remove('selected'));
                updateSelectedCellsDisplay();
            };

            // Mettre à jour l'affichage des cases sélectionnées
            function updateSelectedCellsDisplay() {
                if (selectedCells.length === 0) {
                    selectedCellsDisplay.textContent = 'Cases sélectionnées : Aucune';
                } else {
                    const cellsText = selectedCells.map(cell => `Année ${cell.year}, Semaine ${cell.week}`).join('; ');
                    selectedCellsDisplay.textContent = `Cases sélectionnées : ${cellsText}`;
                }
            }

            // Gérer les clics sur les cases
            grid.addEventListener('click', async (e) => {
                const cell = e.target.closest('div');
                if (!cell || !cell.dataset.year) return;

                const year = parseInt(cell.dataset.year);
                const week = parseInt(cell.dataset.week);
                const key = `${year}-${week}`;

                if (selectMode) {
                    const cellIndex = selectedCells.findIndex(c => c.year === year && c.week === week);
                    if (cellIndex === -1) {
                        selectedCells.push({ year, week });
                        cell.classList.add('selected');
                        console.log(`Case ${key} ajoutée à la sélection`);
                    } else {
                        selectedCells.splice(cellIndex, 1);
                        cell.classList.remove('selected');
                        console.log(`Case ${key} retirée de la sélection`);
                    }
                    updateSelectedCellsDisplay();
                } else {
                    const isFilled = cell.classList.contains('filled');
                    if (!isFilled) {
                        // Ajouter une nouvelle case avec la date actuelle
                        await updateGrid(year, week, 'fill');
                    } else {
                        const timestamp = cell.dataset.timestamp;
                        if (timestamp) {
                            messageBox.textContent = `Case remplie le : ${timestamp}`;
                        } else {
                            messageBox.textContent = 'Case remplie (pas de date)';
                        }
                    }
                }
            });

            // Gestion de l'authentification
            const userStatus = document.getElementById('user-status');
            const loginBtn = document.getElementById('login-btn');
            const signupBtn = document.getElementById('signup-btn');
            const logoutBtn = document.getElementById('logout-btn');

            function updateUI(user) {
                if (user) {
                    userStatus.textContent = `Connecté: ${user.email}`;
                    loginBtn.style.display = 'none';
                    signupBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                    loadGrid();
                } else {
                    userStatus.textContent = 'Non connecté';
                    loginBtn.style.display = 'inline-block';
                    signupBtn.style.display = 'inline-block';
                    logoutBtn.style.display = 'none';
                    grid.querySelectorAll('.filled').forEach(cell => {
                        cell.classList.remove('filled');
                        cell.dataset.timestamp = '';
                    });
                    messageBox.textContent = 'Cliquez sur une case pour voir son état.';
                }
            }

            netlifyIdentity.on('init', (user) => updateUI(user));
            netlifyIdentity.on('login', (user) => { updateUI(user); netlifyIdentity.close(); });
            netlifyIdentity.on('logout', () => updateUI(null));
            netlifyIdentity.on('signup', (user) => { updateUI(user); netlifyIdentity.close(); });

            const checkUser = () => {
                const user = netlifyIdentity.currentUser();
                updateUI(user);
            };
            checkUser();
            setInterval(checkUser, 5000);
        });
    </script>
</body>
</html>
